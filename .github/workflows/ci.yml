name: Launcher checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=moderate

  desktop:
    name: Desktop / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check Rust target architecture
        shell: bash
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --features dev-auth --locked
      - name: Production feature guard
        shell: bash
        run: python3 scripts/check-release-guard.py
      - name: Release IPC restrictions
        run: cargo test -p launcher-desktop --release --locked --lib --features tauri/custom-protocol
      - name: Official Minecraft and Java install smoke
        timeout-minutes: 25
        shell: bash
        run: |
          trap 'cat install-smoke.log install-reuse.log 2>/dev/null || true' ERR
          cargo run -p launcher-core --example install_smoke --locked -- "$RUNNER_TEMP/launcher-install-smoke" > install-smoke.log 2>&1
          cargo run -p launcher-core --example install_smoke --locked -- "$RUNNER_TEMP/launcher-install-smoke" > install-reuse.log 2>&1
          python3 scripts/check-install-reuse.py install-reuse.log
          python3 scripts/check-native-smoke.py install-reuse.log "$RUNNER_TEMP/launcher-install-smoke"
      - name: Pinned Authlib Injector download and integrity smoke
        timeout-minutes: 5
        shell: bash
        run: cargo run -p launcher-core --example agent_smoke --locked -- "$RUNNER_TEMP/launcher-agent-smoke" > agent-smoke.log 2>&1
      - name: Upload installer smoke receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installer-smoke-${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            install-smoke.log
            install-reuse.log
            agent-smoke.log
            hs_err_pid*.log
      - name: Package desktop application
        run: npm run tauri -- build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Upload internal build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launcher-installer-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.msi
