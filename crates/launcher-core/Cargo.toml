[package]
name = "launcher-core"
description = "Desktop-independent contracts and application state for the Minecraft launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
dev-auth = ["dep:md-5"]

[dependencies]
md-5 = { version = "0.11", optional = true }
sha2 = "0.11"
tokio = { version = "1", features = ["rt", "process", "time", "io-util", "macros"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
sha1 = "0.10.6"
regex = "1"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true

